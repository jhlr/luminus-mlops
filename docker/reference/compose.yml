# Ambiente de REFERENCIA: job unico. `just build-reference-docker` (exporta UID/GID).
name: luminus-reference

services:
  build-reference:
    image: luminus-reference:0.1.0
    build:
      context: ../..
      dockerfile: docker/reference/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: none  # job offline
    volumes:
      - ../../data:/app/data:ro
      - ../../artifacts:/app/artifacts  # o unico ponto de escrita
